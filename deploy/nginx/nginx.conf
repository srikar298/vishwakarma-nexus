# ==============================================================================
# Vishwakarma Nexus - Production Nginx Reverse Proxy Configuration ($0 Cost)
# ==============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression ($0 bandwidth savings)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        image/svg+xml;

    # Upstream Fastify Backend
    upstream backend_nodes {
        server 127.0.0.1:3000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name nexus.vkc.org www.nexus.vkc.org;

        # Redirect HTTP to HTTPS (Managed by Certbot / Let's Encrypt)
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name nexus.vkc.org www.nexus.vkc.org;

        # SSL Certificates (Automated Free Let's Encrypt via Certbot)
        ssl_certificate /etc/letsencrypt/live/nexus.vkc.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nexus.vkc.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security Headers ($0 Vulnerability Protection)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Root Directory for Web Hub Production SPA
        root /var/www/vishwakarma-nexus/dist;
        index index.html;

        # 1. Static Assets with 1-Year Immutable Cache ($0 CDN Acceleration)
        location ~* \.(?:css|js|woff2?|svg|gif|png|jpe?g|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            try_files $uri =404;
        }

        # 2. Fastify Modular Monolith API Reverse Proxy
        location /api/ {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Crucial for Fastify trustProxy & Real IP Rate Limiting
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts aligned with backend keepalive
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 3. Liveness & Metrics endpoints
        location /health {
            proxy_pass http://backend_nodes/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # 4. SPA Fallback Routing for React Web Hub
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
